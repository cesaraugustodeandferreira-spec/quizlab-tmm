<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <!-- Rounded square -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Q ring (stroke-based for crisp rendering) -->
  <circle cx="236" cy="228" r="118" stroke="white" stroke-width="52" fill="none"/>
  <!-- Q tail (amber/gold accent) -->
  <line x1="314" y1="316" x2="410" y2="424" stroke="#fbbf24" stroke-width="48" stroke-linecap="round"/>
</svg>
